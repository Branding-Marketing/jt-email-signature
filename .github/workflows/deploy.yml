name: Deploy

# Builds the signature page and deploys it, together with the Feishu login API,
# as a single Cloudflare Worker.
on:
  push:
    # feature/feishu-integration is included so the branch can be previewed before merging
    branches: [main, feature/feishu-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FEISHU_APP_ID FEISHU_APP_SECRET SESSION_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit $missing

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Deploy Worker
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            FEISHU_APP_ID
            FEISHU_APP_SECRET
            SESSION_SECRET
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Print Feishu redirect URL
        run: |
          echo "Site: ${{ steps.worker.outputs.deployment-url }}"
          echo "Whitelist this in Feishu > Security Settings > Redirect URLs:"
          echo "${{ steps.worker.outputs.deployment-url }}/api/auth/feishu/callback"
