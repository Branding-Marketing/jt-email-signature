name: Deploy

# Deploys the Feishu auth Worker to Cloudflare, then the signature page to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FEISHU_APP_ID FEISHU_APP_SECRET SESSION_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit $missing

      # Gives us the public Pages URL, which the Worker needs to redirect back to
      - id: pages
        uses: actions/configure-pages@v5

      - id: worker
        name: Deploy auth Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var APP_URL:${{ steps.pages.outputs.base_url }}/
          secrets: |
            FEISHU_APP_ID
            FEISHU_APP_SECRET
            SESSION_SECRET
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Build page
        env:
          FEISHU_AUTH_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          if [ -z "$FEISHU_AUTH_URL" ]; then echo "::error::Could not read the Worker URL from wrangler"; exit 1; fi
          echo "Worker URL: $FEISHU_AUTH_URL"
          echo "Feishu redirect URL to whitelist: $FEISHU_AUTH_URL/api/auth/feishu/callback"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - id: pages-deploy
        uses: actions/deploy-pages@v4
