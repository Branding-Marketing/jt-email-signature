# One Cloudflare Worker serves both the signature page and the Feishu login API.
# Secrets (FEISHU_APP_ID, FEISHU_APP_SECRET, SESSION_SECRET) are set with `wrangler secret put`.
name = "jt-signature"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Let the Worker handle API routes before static asset matching
run_worker_first = ["/api/*"]
