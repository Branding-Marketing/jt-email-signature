# One Cloudflare Worker serves both the signature page and the Feishu login API.
# Secrets (FEISHU_APP_ID, FEISHU_APP_SECRET, SESSION_SECRET) are set with `wrangler secret put`.
name = "jt-signature"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# User-identity scopes requested at login. Every scope listed must be enabled for the app
# in the Feishu console, or Feishu rejects the login. Add e.g. contact:user.email:readonly
# (email) or contact:user.phone:readonly (mobile) once they are approved.
FEISHU_OAUTH_SCOPE = "directory:employee.work.positions:read"

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Let the Worker handle API routes before static asset matching
run_worker_first = ["/api/*"]
